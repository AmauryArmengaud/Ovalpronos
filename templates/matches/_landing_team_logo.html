{% load match_tags %}
{# Decorative: the team name is printed next to it. No file: initials, as on the match cards #}
{% with logo=team|team_logo_url %}
<span class="landing-team-logo" aria-hidden="true">
  {% if logo %}<img src="{{ logo }}" alt="" width="28" height="28" loading="lazy">{% else %}{{ team.short_name|default:team.name|slice:":3"|upper }}{% endif %}
</span>
{% endwith %}
