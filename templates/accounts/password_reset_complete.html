{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password changed" %} — Oval'Pronos{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-5 text-center">

    <i class="ti ti-shield-check d-block mb-3" style="font-size: 3rem; color: var(--color-brand-rugby);" aria-hidden="true"></i>
    <h1 class="mb-3">{% trans "Password changed!" %}</h1>
    <p class="mb-4">
      {% trans "Your password has been changed successfully. You can now log in." %}
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-accent btn-lg">
      {% trans "Log in" %}
    </a>

  </div>
</div>
{% endblock %}
