<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur — Oval'Pronos</title>
  <style>
    /* Palette: #2B3467 navy, #FCFFF9 cream, #EB455F accent */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FCFFF9;
      color: #2B3467;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .wrap { text-align: center; max-width: 420px; }
    h1 {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.0625rem;
      line-height: 1.6;
      opacity: 0.7;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: #EB455F;
      color: #FCFFF9;
      text-decoration: none;
      border-radius: 100rem;
      font-weight: 700;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>500</h1>
    <p>Une erreur inattendue s'est produite.<br>Nos équipes ont été notifiées.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
