name: Update Odds

on:
  workflow_dispatch:    # Manual trigger only — weekly odds update runs via VPS cron (Tuesday 10:00 UTC)

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run odds updater
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/update_odds.py
