name: Update Odds

on:
  schedule:
    - cron: '0 10 * * 2'   # Mardi 10:00 UTC (12:00 Paris)
  workflow_dispatch:

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run odds updater
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python .github/scripts/update_odds.py
