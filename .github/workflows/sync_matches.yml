name: Sync Matches

on:
  workflow_dispatch:              # Manual trigger only — daily sync runs via VPS cron

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/sync-scores/" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET_TOKEN }}" \
            --fail --show-error --max-time 60 \
          | python3 -m json.tool
