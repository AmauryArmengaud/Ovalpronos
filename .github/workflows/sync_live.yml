name: Sync Live Matches

on:
  schedule:
    - cron: '*/10 12-23 * * 5,6,0'   # Ven/Sam/Dim 12h-23h UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync scores
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/sync-scores/" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET_TOKEN }}" \
            --fail --show-error --max-time 60 \
          | python3 -m json.tool
