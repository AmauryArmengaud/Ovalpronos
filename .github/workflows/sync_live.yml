name: Sync Live Matches

on:
  schedule:
    - cron: '*/10 12-23 * * 5,6,0'   # Ven/Sam/Dim 12h-23h UTC
  workflow_dispatch:

jobs:
  sync-if-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check for live matches
        id: check
        run: |
          RESPONSE=$(curl -s --fail --show-error --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET_TOKEN }}" \
            "${{ secrets.APP_URL }}/api/has-live-matches/")
          IS_LIVE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['live'])")
          echo "is_live=$IS_LIVE" >> "$GITHUB_OUTPUT"

      - name: Sync scores
        if: steps.check.outputs.is_live == 'True'
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/sync-scores/" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET_TOKEN }}" \
            --fail --silent --show-error --max-time 60
