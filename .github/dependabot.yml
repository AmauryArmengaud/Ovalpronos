version: 2
updates:
  # One grouped PR per week for Python packages; CI tests it automatically
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      python-packages:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns: ['*']
